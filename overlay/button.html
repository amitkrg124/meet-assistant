<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="toolbar">
    <div id="grip" title="Drag to move the overlay">⠿</div>
    <button id="listen" class="tb-btn" title="Start / stop listening (Ctrl+Shift+L)">Start</button>
    <button id="answer-now" class="tb-btn" title="Answer the last thing heard (Ctrl+Shift+A)">Answer</button>
    <button id="capture" class="tb-btn" title="Capture the screen and read it">Screen</button>
    <button id="panel-toggle" class="tb-btn" title="Setup &amp; settings (Ctrl+Shift+P)">Setup</button>
    <button id="quit" class="tb-btn" title="Quit Meet Assistant">Quit</button>
  </div>
  <script src="button.js"></script>
</body>
</html>
